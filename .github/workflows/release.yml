name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore Il2CppDumper.sln

      - name: Build
        run: dotnet build Il2CppDumper.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish Il2CppDumper/Il2CppDumper.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
          -Path publish\* `
          -DestinationPath Il2CppDumper-GUI-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Il2CppDumper-GUI-${{ github.ref_name }}.zip
