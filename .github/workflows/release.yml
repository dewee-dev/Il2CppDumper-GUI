name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - '*'          # 仓库实际 tag 是 3.2.0 这种无 v 格式，原来的 'v*' 永远匹配不上
  workflow_dispatch:
    inputs:
      draft:
        description: '创建为草稿（不自动发布，便于先检查产物）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      # 项目 TargetFramework 是 net10.0-windows，原来只装 8.0/9.0 会直接构建失败
      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore Il2CppDumper.sln

      - name: Build
        run: dotnet build Il2CppDumper.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish Il2CppDumper/Il2CppDumper.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: 打包
        id: pack
        run: |
          $ver = (Select-String -Path Il2CppDumper/Il2CppDumper.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $name = "Il2CppDumper.GUI.$ver.zip"
          Compress-Archive -Path 'publish\*' -DestinationPath $name
          "version=$ver" >> $env:GITHUB_OUTPUT
          "zip=$name" >> $env:GITHUB_OUTPUT
          Get-Item $name | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
          VER: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          set -euo pipefail
          # 推 tag 时用 tag 名（3.2.0 / v3.2.0 都行），否则用「版本号-MMDD」
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${VER}-$(date -u +%m%d)"
            # 同一天多次构建：tag 已存在就追加序号
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              n=2
              while gh release view "${TAG}-${n}" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
                n=$((n + 1))
              done
              TAG="${TAG}-${n}"
            fi
          fi

          {
            echo "自动构建产物，基于提交 \`${GITHUB_SHA::7}\`。"
            echo
            echo "需要 .NET 10 Desktop Runtime（框架依赖发布，不含运行时）。"
            echo
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            printf '| `%s` | %s |\n' "$ZIP" "$(du -h "$ZIP" | cut -f1)"
          } > notes.md

          ARGS=(--target "$GITHUB_SHA" --title "Il2CppDumper GUI ${TAG} (Windows)" --notes-file notes.md)
          if [ "$DRAFT" = "true" ]; then
            ARGS+=(--draft)
          else
            ARGS+=(--latest)
          fi

          gh release create "$TAG" "${ARGS[@]}" "$ZIP"
          echo "::notice title=Release 已创建::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
